name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  schema:
    name: DB schema (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: autotrade
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d autotrade"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci-only-placeholder
      PGDATABASE: autotrade
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        run: |
          for f in $(ls autotrade-app/src/main/resources/db/migration/V*__*.sql | sort -V); do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Schema smoke test
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/schema-smoke.sql
