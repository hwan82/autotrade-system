# 선정 프로필(ADR-007 2.1, 카탈로그 docs/strategy/selection-catalog.md). 저장된 버전 파일은 고치지 않는다.
# 예시 (다) 전일 관심 종목(ADR-012 3.3, D-121). 수치는 모두 [가정] 출발값이다. 실험으로 비교하려고 두는 것이지 추천 기준이 아니다.
# 상한가 근접 제외 0.25는 국내 가격제한폭 ±30%(2015-06-15 시행, KrxMarketRules) 기준. volume-spike w20은 c 포함 21거래일이 필요해 min-bar-days 21.
id: "kr-intraday-hot"
version: 1
market: "KRX"
style: "INTRADAY"
created-at: "2026-10-20T00:00:00Z"
parameters:
  hypothesis: "전일 거래대금이 크고 거래량이 평소의 2배 넘게 터지며 3% 이상 오른 종목은 다음 날 장중 변동성과 유동성이 커서, 같은 단타 매매지표의 비용 차감 성과가 무작위로 고른 같은 수 종목보다 높다(기대 방향 +)"
  refresh: "PRE_OPEN_DAILY"
  max-symbols: "20"
  filter.kinds: "STOCK"
  filter.min-price: "1000"
  filter.min-bar-days: "21"
  gate.01.metric: "avg-turnover"
  gate.01.window: "1"
  gate.01.op: "GE"
  gate.01.value: "10000000000"
  gate.02.metric: "volume-spike"
  gate.02.window: "20"
  gate.02.op: "GE"
  gate.02.value: "2"
  gate.03.metric: "return"
  gate.03.window: "1"
  gate.03.op: "GE"
  gate.03.value: "0.03"
  gate.04.metric: "return"
  gate.04.window: "1"
  gate.04.op: "LE"
  gate.04.value: "0.25"
  score.metric: "avg-turnover"
  score.window: "1"
  score.order: "DESC"
