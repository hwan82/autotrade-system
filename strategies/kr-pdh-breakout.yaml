# 장중 전일 고점 돌파 + 거래량 확인
id: kr-pdh-breakout
version: 1
market: KRX
style: INTRADAY
hypothesis: "국내 종목이 갭 없이 시작한 날 장중에 전일 고가를 거래량과 함께 넘으면 매도 물량이 소화된 것이므로, 돌파에 사서 당일 안에 청산하면 비용 차감 후 수익이 난다"
logic: prior-day-high
signal:
  margin-pct: 0.2
entry:
  window:
    start: "09:15"
    end: "14:00"
  expiry-seconds: 600
  confirm:
    volume-ratio: 1.5
    window-minutes: 5
universe:
  min-price: 1000
sizing:
  risk-per-trade-pct: 0.5
  max-position-pct: 20
  max-positions: 3
  cash-buffer-pct: 5
limits:
  max-entries-per-day: 6
  reentry-cooldown-minutes: 30
  daily-loss-limit-pct: 2
  max-consecutive-stops: 3
exit:
  stop-loss-pct: 1.5
  take-profit-pct: 4
  trailing-pct: 1.5
  eod: FLATTEN
  eod-time: "15:10"
study:
  warmup-days: 1   # 신호에 필요한 지난 거래일 수(C6 하루 평균에서 뺀다)
  key-param: signal.margin-pct
