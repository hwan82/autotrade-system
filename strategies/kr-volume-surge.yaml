# 장중 거래량 폭증 + 가격 상승
id: kr-volume-surge
version: 1
market: KRX
style: INTRADAY
hypothesis: "국내 장중 5분 거래량이 앞선 평균의 3배 이상으로 늘며 가격이 0.5% 이상 오르면 수급 유입이 이어지므로, 그때 사서 1시간 안에 청산하면 비용 차감 후 수익이 난다"
logic: volume-surge
signal:
  window-minutes: 5
  surge-ratio: 3.0
  min-rise-pct: 0.5
entry:
  window:
    start: "09:30"
    end: "14:30"
  expiry-seconds: 600
universe:
  min-price: 1000
sizing:
  risk-per-trade-pct: 0.5
  max-position-pct: 20
  max-positions: 3
  cash-buffer-pct: 5
limits:
  max-entries-per-day: 6
  reentry-cooldown-minutes: 30
  daily-loss-limit-pct: 2
  max-consecutive-stops: 3
exit:
  stop-loss-pct: 1.5
  take-profit-pct: 3
  time-exit-minutes: 60
  eod: FLATTEN
  eod-time: "15:10"
study:
  key-param: signal.surge-ratio
