name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Start each process once (ARC-03)
        env:
          AUTOTRADE_CONFIG_DIR: ${{ runner.temp }}/autotrade-config
        run: |
          ./gradlew --no-daemon :autotrade-app-engine:installDist :autotrade-app-gateway:installDist \
            :autotrade-app-watchdog:installDist :autotrade-app-lab:bootJar
          WATCHDOG=autotrade-app-watchdog/build/install/autotrade-watchdog/bin/autotrade-watchdog
          # 감시 설정이 틀리면 감시는 종료 코드 2로 뜨지 않는다(D-092, PR #115 risk-ops K2)
          BAD_CFG="$RUNNER_TEMP/watchdog-bad-config"
          mkdir -p "$BAD_CFG" && echo "interval-second=5" > "$BAD_CFG/watchdog.properties"
          set +e; AUTOTRADE_CONFIG_DIR="$BAD_CFG" "$WATCHDOG" > watchdog-bad.log 2>&1; BAD_EXIT=$?; set -e
          test "$BAD_EXIT" = "2" || { echo "틀린 감시 설정인데 종료 코드 $BAD_EXIT"; cat watchdog-bad.log; exit 1; }
          # 실전 엔진은 명령 채널(로컬 소켓)을 열고 계속 돈다(ADR-006). 소켓이 생기는지 확인하고, 실험실이 붙은 뒤에 끈다
          ENGINE_PID=""; LAB_PID=""; GW_PID=""; WATCHDOG_PID=""
          # 어느 단계에서 실패해도 띄운 프로세스를 남기지 않는다
          trap 'kill $LAB_PID $ENGINE_PID $GW_PID $WATCHDOG_PID 2>/dev/null || true' EXIT
          # 감시는 계속 돌며 점검마다 자기 하트비트를 쓴다(D-092). 설정 폴더가 없어도 만들고 뜬다
          "$WATCHDOG" > watchdog.log 2>&1 &
          WATCHDOG_PID=$!
          for i in $(seq 1 30); do
            if [ -f "$AUTOTRADE_CONFIG_DIR/heartbeat/watchdog.hb" ]; then break; fi
            if ! kill -0 "$WATCHDOG_PID" 2>/dev/null; then cat watchdog.log; exit 1; fi
            sleep 1
          done
          test -f "$AUTOTRADE_CONFIG_DIR/heartbeat/watchdog.hb" || { cat watchdog.log; exit 1; }
          # 시세 게이트웨이는 수신·녹화를 위해 계속 돈다(ADR-003). 기동 로그를 확인하고, 살아 있는지 본 뒤
          # SIGTERM으로 40초 안에 종료(종료 훅이 녹화기를 닫음)되는지 확인한다
          autotrade-app-gateway/build/install/autotrade-gateway/bin/autotrade-gateway > gateway.log 2>&1 &
          GW_PID=$!
          for i in $(seq 1 30); do
            if grep -q "ProcessStartup start" gateway.log; then break; fi
            if ! kill -0 "$GW_PID" 2>/dev/null; then cat gateway.log; exit 1; fi
            sleep 1
          done
          grep -q "ProcessStartup start" gateway.log || { cat gateway.log; exit 1; }
          sleep 2
          kill -0 "$GW_PID" || { cat gateway.log; exit 1; }
          kill "$GW_PID"
          for i in $(seq 1 40); do
            if ! kill -0 "$GW_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          cat gateway.log
          if kill -0 "$GW_PID" 2>/dev/null; then
            echo "게이트웨이가 SIGTERM 뒤 40초 안에 끝나지 않았습니다"
            kill -9 "$GW_PID"
            exit 1
          fi
          GW_PID=""
          autotrade-app-engine/build/install/autotrade-engine/bin/autotrade-engine > engine.log 2>&1 &
          ENGINE_PID=$!
          for i in $(seq 1 30); do
            if [ -S "$AUTOTRADE_CONFIG_DIR/run/engine-control.sock" ]; then break; fi
            if ! kill -0 "$ENGINE_PID" 2>/dev/null; then cat engine.log; exit 1; fi
            sleep 1
          done
          test -S "$AUTOTRADE_CONFIG_DIR/run/engine-control.sock" || { cat engine.log; exit 1; }
          test "$(stat -c '%a' "$AUTOTRADE_CONFIG_DIR/run")" = "700"
          test "$(stat -c '%a' "$AUTOTRADE_CONFIG_DIR/run/engine-control.sock")" = "600"
          # 실전 엔진 하트비트(D-092)
          for i in $(seq 1 10); do
            if [ -f "$AUTOTRADE_CONFIG_DIR/heartbeat/engine.hb" ]; then break; fi
            sleep 1
          done
          test -f "$AUTOTRADE_CONFIG_DIR/heartbeat/engine.hb" || { cat engine.log; exit 1; }
          # 감시가 엔진을 살아 있음으로 볼 때까지 기다린다(점검 주기 5초라 엔진을 너무 빨리 끄면 놓친다)
          for i in $(seq 1 15); do
            if grep -qE "engine .*ABSENT .* ALIVE" watchdog.log; then break; fi
            sleep 1
          done
          grep -qE "engine .*ABSENT .* ALIVE" watchdog.log || { echo "감시가 엔진 하트비트를 보지 못했습니다"; cat watchdog.log; exit 1; }
          # 같은 설정 폴더로 두 번째 엔진은 뜨지 않는다(run/engine.lock)
          if autotrade-app-engine/build/install/autotrade-engine/bin/autotrade-engine > engine2.log 2>&1; then
            echo "두 번째 엔진이 떴습니다"; cat engine2.log; exit 1
          fi
          # 실험실은 대시보드 웹 서버(127.0.0.1)를 띄우고 계속 돈다(ADR-005). 응답을 확인한 뒤 끈다
          java -jar autotrade-app-lab/build/libs/autotrade-app-lab-*-SNAPSHOT.jar --spring.main.banner-mode=off \
            --server.port=18480 > lab.log 2>&1 &
          LAB_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18480/api/session; then break; fi
            if ! kill -0 "$LAB_PID" 2>/dev/null; then cat lab.log; exit 1; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18480/ || { cat lab.log; exit 1; }
          # 루프백이 아닌 Host는 거부해야 한다(DNS rebinding 방지, UI-01)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:18480/api/session)" = "403"
          # 운영 화면 API가 명령 채널로 실전 엔진 상태를 읽는다(계좌 미설정이라 빈 목록)
          curl -fsS http://127.0.0.1:18480/api/real/status | grep -q '"engineState":"UP"' || { cat lab.log engine.log; exit 1; }
          kill "$LAB_PID" "$ENGINE_PID"
          wait "$ENGINE_PID" || true
          test ! -e "$AUTOTRADE_CONFIG_DIR/run/engine-control.sock" || { echo "종료 후 소켓이 남았습니다"; cat engine.log; exit 1; }
          # 정상 종료는 하트비트 파일을 지운다(감시가 꺼짐과 멈춤을 가름, D-092)
          test ! -e "$AUTOTRADE_CONFIG_DIR/heartbeat/engine.hb" || { echo "종료 후 엔진 하트비트가 남았습니다"; exit 1; }
          for i in $(seq 1 15); do
            if grep -qE "engine .*ALIVE .* ABSENT" watchdog.log; then break; fi
            sleep 1
          done
          grep -qE "engine .*ALIVE .* ABSENT" watchdog.log || { echo "감시가 엔진 종료를 보지 못했습니다"; cat watchdog.log; exit 1; }
          kill "$WATCHDOG_PID"
          for i in $(seq 1 10); do
            if ! kill -0 "$WATCHDOG_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          cat watchdog.log
          if kill -0 "$WATCHDOG_PID" 2>/dev/null; then echo "감시가 SIGTERM 뒤 10초 안에 끝나지 않았습니다"; kill -9 "$WATCHDOG_PID"; exit 1; fi
          WATCHDOG_PID=""
          test ! -e "$AUTOTRADE_CONFIG_DIR/heartbeat/watchdog.hb" || { echo "종료 후 감시 하트비트가 남았습니다"; exit 1; }
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # 실험실 화면 브라우저 시험(D-101, 5단계 QA 권고 R3). 실험실 둘(배포본, 데모)을 띄워 실험 생성 → 화면이 알려 준 실행 명령 →
  # 불러오기 → 비교, 진행 상태 화면(진행 막대·워크포워드 전체 진행률·취소)을 headless Chromium으로 조작한다.
  # 실전 엔진·증권사·시세 게이트웨이는 띄우지 않는다. 실행 명령의 장 시간 보호만 CI에서 푼다(실전 엔진이 없는 러너)
  ui-e2e:
    name: Lab screens (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: autotrade-ui/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: autotrade-ui/e2e/package-lock.json
      - name: Build lab jar, demo lab and experiment command
        working-directory: .
        run: ./gradlew --console=plain :autotrade-app-lab:bootJar :autotrade-app-lab:testClasses :autotrade-app-experiment:classes
      - name: Install Playwright (lockfile pinned) and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lab screen tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            autotrade-ui/e2e/playwright-report/
            autotrade-ui/e2e/test-results/
          retention-days: 7

  schema:
    name: DB schema (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: autotrade
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d autotrade"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci-only-placeholder
      PGDATABASE: autotrade
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to an empty DB in order (ARC-07)
        run: |
          for f in $(ls autotrade-app-lab/src/main/resources/db/migration/V*__*.sql | sort -V); do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Schema smoke test
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/schema-smoke.sql

  guards:
    name: Secret scan and collector boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Secret scan, full history (CFG-03)
        run: ./gitleaks git --redact --exit-code 1 .
      - name: Python collector boundary (ARC-06, D-019)
        run: scripts/ci/check-python-collectors.sh
      - name: Collector key values (MD-11, ADR-008)
        run: scripts/ci/check-collector-keys.sh
      - name: Protected change marker self-test
        run: scripts/ci/test-mark-protected-changes.sh
      - name: Protected change marker (QA PR #112 F1)
        if: github.event_name == 'pull_request'
        run: scripts/ci/mark-protected-changes.sh "${{ github.base_ref }}"
