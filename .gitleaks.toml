# gitleaks 설정: 기본 규칙 그대로 쓰고, 실제 키가 아닌 것이 확실한 리터럴만 하나씩 예외로 둔다.
# 실제 비밀값은 절대 여기에 올리지 않는다. 비밀값이 커밋되면 예외 처리 대신 키를 폐기·재발급한다.
# 커밋 지문(.gitleaksignore)은 스쿼시 머지 뒤 지문이 바뀌어 맞지 않으므로, 머지로 main에 들어갈 파일은 여기서 값으로 예외를 둔다.
[extend]
useDefault = true

[allowlist]
description = "검토 원문에 인용된 CI 패턴 시험 입력(실제 키 아님)"
regexes = [
  # docs/reviews/pr-39/architect.md: check-python-collectors.sh 패턴 시험에 쓴 가짜 값(검토 원문은 고치지 않는다, 지침 11장)
  '''^abcdef1234567890$''',
]
